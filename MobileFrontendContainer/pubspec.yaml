name: MobileFrontendContainer
description: "Minimal Flutter notes app with local persistence and optional backend summarize."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  # Keep dependencies minimal and aligned with lockfile
  flutter_dotenv: ^5.1.0
  shared_preferences: ^2.2.2
  http: ^1.1.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
